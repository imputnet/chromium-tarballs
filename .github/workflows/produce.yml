name: produce chromium release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: prepare runner
        run: python .github/scripts/setup_runner.py
      - name: prepare, package, verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/produce.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version }}-linux-x64
          path: ${{ env.PRODUCER_OUTPUT }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version }}-base-reference
          path: |
            ${{ env.PRODUCER_OUTPUT }}/manifest.json
            ${{ env.PRODUCER_OUTPUT }}/inputs.json
            ${{ env.PRODUCER_OUTPUT }}/*-base.contents.jsonl
            ${{ env.PRODUCER_OUTPUT }}/*-base.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  desktop:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: mac-x64
            runner: macos-26-intel
          - host: mac-arm64
            runner: macos-26
          - host: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: prepare runner
        run: python .github/scripts/setup_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version }}-base-reference
          path: linux-dist/
      - name: prepare, package, verify
        env:
          VERSION: ${{ inputs.version }}
          PRODUCER_HOST: ${{ matrix.host }}
        run: python .github/scripts/produce.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version }}-${{ matrix.host }}
          path: |
            ${{ env.PRODUCER_OUTPUT }}/
            !${{ env.PRODUCER_OUTPUT }}/*-base.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [linux, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.version }}-*
          path: bundles/
      - name: install upload client
        run: python -m pip install awscli
      - name: publish bundles
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '5'
        run: python3 .github/scripts/publish.py
